# Valence on MySQL rather than Postgres. Laid over compose.yaml rather than instead of it:
#
#   docker compose -f compose.yaml -f compose.mysql.yaml up -d
#
# The password is still POSTGRES_PASSWORD, kept from when Postgres was the only choice so that one
# setting serves whichever database is chosen. The data lives in a volume of its own, since a
# Postgres data directory is no use to MySQL and the other way round. Choose before the first start:
# Valence moves no data from one kind of database to another.

services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_bin
    environment: !override
      MYSQL_ROOT_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MYSQL_USER: valence
      MYSQL_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MYSQL_DATABASE: valence
      TZ: ${TZ:-UTC}
    volumes: !override
      - db-data-mysql:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uvalence -p"$$MYSQL_PASSWORD"']

  valence:
    environment:
      DATABASE_URL: mysql://valence:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:3306/valence

  requests:
    environment:
      DATABASE_URL: mysql://valence:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:3306/valence

volumes:
  db-data-mysql:
