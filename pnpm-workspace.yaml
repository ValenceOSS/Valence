packages:
  - 'apps/desktop'
  - 'apps/mobile'
  - 'apps/docs'
  - 'apps/landing'
  - 'apps/web'
  - 'apps/server'
  - 'apps/requests'
  - 'apps/transcoder'
  - 'apps/tv'
  - 'packages/*'
  - 'tools'

onlyBuiltDependencies:
  - electron
  - electron-winstaller
  - esbuild

# react-native-tvos adds its television types to the module named react-native, looked up from
# inside its own package. With the phone's react-native beside it in the workspace, that found the
# phone's copy and the television lost its types. As a peer, the name is the television's own
# react-native, which is react-native-tvos.
packageExtensions:
  react-native-tvos:
    peerDependencies:
      react-native: '*'
patchedDependencies:
  '@react-native-cookies/cookies': patches/@react-native-cookies__cookies.patch
  # electron-vite 5 found the last import in a built bundle with a regular expression, which took a
  # string ending in "import" for one and spliced its shims into the middle of it, so the desktop's
  # main process built empty. 6.0 parses the bundle instead; this is that change, to drop with 6.0.
  electron-vite@5.0.0: patches/electron-vite@5.0.0.patch

# drizzle-orm is resolved once per set of optional peers it finds. better-auth brings
# better-sqlite3 12 into the server, while the database package and the requests service would pick
# 13, which made two drizzle-orm copies whose types don't match. Nothing here uses SQLite; one
# version keeps one drizzle-orm.
overrides:
  better-sqlite3: 12.11.1
