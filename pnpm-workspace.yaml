packages:
  - 'apps/desktop'
  - 'apps/mobile'
  - 'apps/docs'
  - 'apps/landing'
  - 'apps/metrics'
  - 'apps/web'
  - 'apps/server'
  - 'apps/requests'
  - 'apps/transcoder'
  - 'apps/tv'
  - 'packages/*'

autoInstallPeers: true
saveExact: true
strictPeerDependencies: false

allowBuilds:
  '@parcel/watcher': false
  '@prisma/client': false
  better-sqlite3: false
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  lfa-ponyfill: false
  unrs-resolver: false
  vue-demi: false

# drizzle-orm is resolved once per set of optional peers it finds, and better-auth, the database
# package and the requests service would otherwise bring different versions of better-sqlite3, which
# made two drizzle-orm copies whose types don't match. One version keeps one drizzle-orm.
#
# It has to be 13. The requests service's Cloudflare browser, camoufox-js, opens a SQLite file every
# time it starts, and 13 carries its compiled module for each platform inside the package. 12 has to
# fetch one in an install script, which pnpm skips here and the requests image skips by design, so
# pinned to 12 the browser could not start anywhere.
overrides:
  # Patched releases of what other packages bring in, held within the major each one asks for, until
  # those packages ask for them themselves (VAL-353).
  '@dicebear/initials': 9.4.3
  better-sqlite3: 13.0.3
  brace-expansion@1: 1.1.20
  brace-expansion@5: 5.0.11
  compression: 1.8.2
  fast-uri@3: 3.1.8
  shell-quote@1: ^1.11.0
  source-map-js: 1.2.2
  undici@7: ^7.29.1

# A package that looks up the module named react-native from inside itself finds whichever copy
# pnpm happened to hoist, the phone's or the television's. As a peer, the name is the app's own
# react-native. react-native-tvos adds its television types to it, and the jest preset loads its
# test setup and mocks from it.
packageExtensions:
  '@react-native/jest-preset':
    peerDependencies:
      react-native: '*'
  react-native-tvos:
    peerDependencies:
      react-native: '*'
patchedDependencies:
  '@keyline-icons/react@1.8.0': patches/@keyline-icons__react@1.8.0.patch
  expo-glass-tabs@0.1.1: patches/expo-glass-tabs@0.1.1.patch
  expo-video@57.0.4: patches/expo-video@57.0.4.patch
  mediabunny@1.62.0: patches/mediabunny@1.62.0.patch
  react-native-web@0.21.3: patches/react-native-web@0.21.3.patch
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.19'
  - '@expo/config-plugins@58.0.12'
  - '@expo/config@58.0.11'
  - '@expo/env@2.5.4'
  - '@expo/fingerprint@0.21.9'
  - '@expo/inline-modules@0.2.9'
  - '@expo/local-build-cache-provider@58.0.11'
  - '@expo/log-box@58.0.15'
  - '@expo/metro-config@58.0.21'
  - '@expo/prebuild-config@58.0.19'
  - '@expo/router-server@58.0.21'
  - '@expo/ui@58.0.27'
  - babel-preset-expo@58.0.24
  - expo-asset@58.0.20
  - expo-constants@58.0.15
  - expo-modules-autolinking@58.0.17
  - expo-modules-core@58.0.30
  - expo-modules-jsi@58.0.22
  - expo-notifications@58.1.8
  - expo-screen-orientation@58.0.4
  - expo@58.0.23
  - jest-expo@58.0.14
  - react-native-safe-area-context@5.11.1
