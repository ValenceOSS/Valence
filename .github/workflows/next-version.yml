name: Next version

# Works out the release that main is on the way to, for the dev builds to be named after: the dev
# images in dev-image.yml and the desktop app's dev channel in desktop-dev.yml. One answer, asked for
# in one place, so an image and an app built from the same commit never disagree about what they are.

on:
  workflow_call:
    outputs:
      next:
        description: The version of the release being worked towards, such as 1.4.0
        value: ${{ jobs.version.outputs.next }}

permissions:
  contents: read

jobs:
  version:
    name: Work out the next version
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      next: ${{ steps.next.outputs.next }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The release that is being worked towards. Release-please keeps a pull request open for it, and
      # its title names the version it has decided on — `chore(main): release 1.0.0` — which is the
      # honest answer, including when a commit asked for a particular number with `Release-As`. Where
      # there is no such pull request the next patch after the last release stands in: a name that
      # says "on the way to something after the last release", which is all a dev build needs to say.
      # Only release-please's own pull request counts, from this repository into main, since a fork
      # can open one from a branch of the same name and would otherwise choose the version.
      - name: Read the release being prepared
        id: next
        run: |
          title="$(
            gh pr list --repo "${REPO}" --head "${BRANCH}" --base main --state open \
              --json headRefName,isCrossRepository,title |
              jq -r --arg branch "${BRANCH}" \
                'map(select(.headRefName == $branch and .isCrossRepository == false))[0].title // ""'
          )"
          next="$(echo "${title}" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"

          if [ -z "${next}" ]; then
            last="$(jq -r '.["."]' .release-please-manifest.json)"
            IFS=. read -r major minor patch <<< "${last}"
            next="${major}.${minor}.$((patch + 1))"
          fi

          echo "next=${next}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: release-please--branches--main--components--valence
