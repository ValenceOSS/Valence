name: Desktop test build

# Builds the desktop app for whichever platforms are ticked, from any branch, for trying a change out
# on the machine it is for. The build itself is desktop.yml's, so a test build is packaged exactly as
# a release is; this only chooses what to build, so nobody waits on three runners for one installer.
#
# Start it from the Actions tab, or with
#   gh workflow run desktop-test-build.yml --ref <branch> -f windows=true -f macos=false -f linux=false
# and download the installer from the run's page.

on:
  workflow_dispatch:
    inputs:
      windows:
        description: Windows
        type: boolean
        default: true
      macos:
        description: macOS
        type: boolean
        default: false
      linux:
        description: Linux
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build
    uses: ./.github/workflows/desktop.yml
    with:
      platforms: ${{ format('{0},{1},{2}', inputs.windows && 'Windows' || '', inputs.macos && 'macOS' || '', inputs.linux && 'Linux' || '') }}
    secrets: inherit
