name: Desktop app

# Builds the desktop app's installers, so a release has something to attach.
#
# A workflow of its own, called by release.yml, because it needs a different operating system and
# so that it can be run by hand to prove the app still packages without cutting a release. To build
# only some platforms, for trying a branch out, start desktop-test-build.yml instead. It runs on
# a release and when somebody starts it, and on nothing else: three runners, one of them a macOS one,
# is not a cost every pull request should carry.
#
# It builds; it does not publish. release.yml takes what it produced and hangs it on the release, so
# the one place that writes to a release stays the one that already does.
#
# What it hands over is more than the installers. The desktop app updates itself with
# electron-updater, which finds a new version by reading latest.yml, latest-mac.yml or
# latest-linux.yml off the release, downloads the file named there, and uses the .blockmap beside
# it to fetch only what changed. On macOS what it installs is the .zip rather than the .dmg. Without
# those, a release looks like no release at all to every copy already installed.
#
# Each installer is also handed over by itself, unzipped, so one can be downloaded straight off the
# run's page. Everything a run produces goes into one zipped artefact per platform as well, which is
# the one release.yml hangs on the release file by file.
#
# The macOS app is signed with a Developer ID and notarised by Apple wherever the certificate is
# there to do it, and built unsigned as before where it is not, so a fork or a run before the
# certificate exists still builds. It needs, under Settings → Secrets and variables → Actions:
#   MAC_CERTIFICATE_P12        the Developer ID Application certificate exported as a .p12, in base64
#   MAC_CERTIFICATE_PASSWORD   the password the .p12 was exported with
#   ASC_KEY_ID, ASC_ISSUER_ID and ASC_API_KEY_P8, the App Store Connect key the phone's TestFlight
#   workflow already uses, which is what notarising is asked with
# Windows and Linux are not signed: Windows SmartScreen warns on first run until there is a
# certificate for it too.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose version to stamp on it, or leave empty for a development build
        required: false
        default: ''
      ref:
        description: Branch or commit to build the source from, where it should not be the tag itself
        required: false
        default: ''
      platforms:
        description: Which of Windows, macOS and Linux to build, separated by commas, or empty for all three
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: The release tag to build
        required: false
        type: string
        default: ''
      ref:
        description: Branch or commit to build the source from, where it should not be the tag itself
        required: false
        type: string
        default: ''
      platforms:
        description: Which of Windows, macOS and Linux to build, separated by commas, or empty for all three
        required: false
        type: string
        default: ''

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which platforms to build: all three for a release or a run started here, and whichever were
  # ticked for a test build started from desktop-test-build.yml. A matrix cannot be trimmed by an
  # input directly, so the rows are written out here and the ones asked for handed to the build.
  platforms:
    name: Choose the platforms
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.chosen.outputs.include }}
    steps:
      - id: chosen
        env:
          ASKED: ${{ inputs.platforms }}
        run: |
          include=$(jq -c --arg asked "$ASKED" '
            ($asked | split(",") | map(select(. != ""))) as $wanted
            | [.[] | select($asked == "" or (.name as $name | $wanted | index($name)))
                   | .files |= join("\n")]' <<'ROWS'
          [
            {
              "name": "Windows",
              "runner": "windows-2025-vs2026",
              "flags": "--win --x64",
              "installer": "apps/desktop/release/Valence-Setup-*.exe",
              "also": "",
              "files": [
                "apps/desktop/release/Valence-Setup-*.exe",
                "apps/desktop/release/Valence-Setup-*.exe.blockmap",
                "apps/desktop/release/latest.yml"
              ]
            },
            {
              "name": "macOS",
              "runner": "macos-26",
              "flags": "--mac --arm64 --x64",
              "installer": "apps/desktop/release/Valence-*-arm64.dmg",
              "also": "apps/desktop/release/Valence-*-x64.dmg",
              "files": [
                "apps/desktop/release/Valence-*.dmg",
                "apps/desktop/release/Valence-*.dmg.blockmap",
                "apps/desktop/release/Valence-*-mac.zip",
                "apps/desktop/release/Valence-*-mac.zip.blockmap",
                "apps/desktop/release/latest-mac.yml"
              ]
            },
            {
              "name": "Linux",
              "runner": "ubuntu-24.04",
              "flags": "--linux --x64",
              "installer": "apps/desktop/release/Valence-*.AppImage",
              "also": "",
              "files": [
                "apps/desktop/release/Valence-*.AppImage",
                "apps/desktop/release/latest-linux.yml"
              ]
            }
          ]
          ROWS
          )

          if [ "$include" = "[]" ]; then
            echo "Nothing to build: tick at least one of Windows, macOS and Linux." >&2
            exit 1
          fi

          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    name: Build for ${{ matrix.name }}
    needs: platforms
    runs-on: ${{ matrix.runner }}
    env:
      IS_SIGNED: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}
    steps:
      # The tag unless told otherwise. A release cut before the packaging was written cannot build
      # its own desktop app, and `ref` is how one is built from source that can, still stamped with
      # the release's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app's own package.json says 0.0.0, since versions are cut by release-please rather than
      # written into packages. The installer is named for the release it belongs to, so the version
      # is written into this checkout's copy before it is built. Not passed as a builder flag: a
      # dotted `-c.extraMetadata.version` is split apart on the way through PowerShell.
      - name: Stamp the release's version on it
        shell: bash
        working-directory: apps/desktop
        run: |
          if [ -n "$TAG" ]; then
            npm pkg set version="${TAG#v}"
          else
            npm pkg set version="0.0.0-dev"
          fi
        env:
          TAG: ${{ inputs.tag }}

      - run: pnpm --filter @valence/desktop exec electron-vite build

      # The part of the app written in Rust, which asks Windows for a passkey. A Mac and Linux sign in
      # with one in the browser, so they build nothing and need no toolchain.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        if: matrix.name == 'Windows'
        with:
          toolchain: stable

      - name: Build the native module
        if: matrix.name == 'Windows'
        run: pnpm --filter @valence/desktop run native

      # The certificate goes into a keychain of this job's own, made and unlocked here, where the
      # builder finds the Developer ID in it. The builder can make one itself from the certificate,
      # but on current macOS runners it then cannot unlock what it made. The keychain and the
      # notarising key go with the runner.
      - name: Put the signing certificate in a keychain of its own
        if: matrix.name == 'macOS' && env.IS_SIGNED == 'true'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"

          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MAC_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          mkdir -p "$RUNNER_TEMP/notarising"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/notarising/AuthKey_$ASC_KEY_ID.p8"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

      # Signed and notarised on macOS where the certificate was put in a keychain above; otherwise
      # no identity is looked for, since there is none and looking on a runner only warns.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$IS_SIGNED" = "true" ]; then
            export APPLE_API_KEY="$RUNNER_TEMP/notarising/AuthKey_$ASC_KEY_ID.p8"
            export APPLE_API_KEY_ID="$ASC_KEY_ID"
            export APPLE_API_ISSUER="$ASC_ISSUER_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi

          pnpm --filter @valence/desktop exec electron-builder ${{ matrix.flags }} --publish never
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

      # A signature that is there but wrong fails here rather than on somebody's Mac: every app
      # built is checked, and Gatekeeper is asked whether it would open it.
      - name: Check the signature
        if: matrix.name == 'macOS' && env.IS_SIGNED == 'true'
        shell: bash
        run: |
          for app in apps/desktop/release/mac*/Valence.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
          done

      - name: Hand over the installer on its own
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.installer }}
          archive: false
          if-no-files-found: error

      - name: Hand over the other installer on its own
        if: matrix.also != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.also }}
          archive: false
          if-no-files-found: error

      - name: Hand over everything, for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valence-desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
