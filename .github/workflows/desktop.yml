name: Desktop app

# Builds the desktop app's installers, so a release has something to attach.
#
# A workflow of its own, called by release.yml, because it needs a different operating system and
# so that it can be run by hand to prove the app still packages without cutting a release. To build
# only some platforms, for trying a branch out, start desktop-test-build.yml instead. It runs on
# a release and when somebody starts it, and on nothing else: four runners, one of them a macOS one,
# is not a cost every pull request should carry.
#
# It builds; it does not publish. release.yml takes what it produced and hangs it on the release, and
# desktop-dev.yml hangs a dev channel build on the dev channel's.
#
# The app is Tauri: a Rust host around the system's own webview. `tauri build` compiles the host for
# one target at a time and bundles it, and the files it writes are renamed here to the names the
# Electron app's installers had, so a link to `Valence-Setup-<version>-x64.exe` keeps its shape.
#
# What it hands over is more than the installers. The app updates itself with Tauri's updater, which
# reads latest.json off the release, downloads the bundle named there for its platform, and installs
# it only if it matches the signature beside it in the manifest. Each bundle is signed with the
# updater's own key as it is built, and the manifest job below writes latest.json from the bundles
# and their .sig files once every platform is done. On macOS what the updater installs is the
# .app.tar.gz rather than the .dmg; on Windows and Linux it is the installer and the AppImage
# themselves. Without the manifest, a release looks like no release at all to every copy installed.
#
# Copies of the Electron app this one replaced are still installed, and they update themselves with
# electron-updater, which reads its own feeds off the release: latest.yml for Windows,
# latest-mac.yml for macOS and latest-linux.yml and latest-linux-arm64.yml for Linux, or dev.yml and
# the like on the dev channel. The manifest job writes those too, each pointing at this app's own
# installers, so an Electron copy updates straight into this app and nobody has to install it by
# hand. On Windows it runs the NSIS installer quietly; the hooks written for the installer below run
# the Electron app's uninstaller first, keeping its data, and start the app again after. On macOS it
# installs from a .zip of the .app, made here beside the .dmg, which only takes where both apps are
# signed by the same Developer ID. On Linux it puts the AppImage in place of the old one.
#
# The updater's key is not optional for a release or a dev channel build: one built without it could
# never be updated, so those fail here rather than ship. A test build without the key is built
# without updater bundles. It needs, under Settings → Secrets and variables → Actions:
#   TAURI_SIGNING_PRIVATE_KEY           secret: the private key `tauri signer generate` wrote
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  secret: the password it was generated with
#   TAURI_UPDATER_PUBKEY                variable: the public key beside it, the .pub file's contents
#
# Each installer is also handed over by itself, unzipped, so one can be downloaded straight off the
# run's page. Everything a run produces goes into one zipped artefact per platform as well, which is
# the one release.yml hangs on the release file by file.
#
# The macOS app is signed with a Developer ID and notarised by Apple wherever the certificate is
# there to do it, and built unsigned as before where it is not, so a fork or a run before the
# certificate exists still builds. It needs, under Settings → Secrets and variables → Actions:
#   MAC_CERTIFICATE_P12        the Developer ID Application certificate exported as a .p12, in base64
#   MAC_CERTIFICATE_PASSWORD   the password the .p12 was exported with
#   ASC_KEY_ID, ASC_ISSUER_ID and ASC_API_KEY_P8, the App Store Connect key the phone's TestFlight
#   workflow already uses, which is what notarising is asked with
# Windows and Linux are not signed: Windows SmartScreen warns on first run until there is a
# certificate for it too.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose version to stamp on it, or leave empty for a development build
        required: false
        default: ''
      ref:
        description: Branch or commit to build the source from, where it should not be the tag itself
        required: false
        default: ''
      platforms:
        description: Which of Windows, macOS and Linux to build, separated by commas, or empty for all three
        required: false
        default: ''
      dev_version:
        description: A dev channel version to stamp on it, such as 1.4.0-dev.12, or empty for none
        required: false
        default: ''
  workflow_call:
    inputs:
      tag:
        description: The release tag to build
        required: false
        type: string
        default: ''
      ref:
        description: Branch or commit to build the source from, where it should not be the tag itself
        required: false
        type: string
        default: ''
      platforms:
        description: Which of Windows, macOS and Linux to build, separated by commas, or empty for all three
        required: false
        type: string
        default: ''
      dev_version:
        description: A dev channel version to stamp on it, such as 1.4.0-dev.12, or empty for none
        required: false
        type: string
        default: ''

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which platforms to build: all three for a release or a run started here, and whichever were
  # ticked for a test build started from desktop-test-build.yml. A matrix cannot be trimmed by an
  # input directly, so the rows are written out here and the ones asked for handed to the build.
  #
  # Linux is two rows, each on a runner of its own processor: an AppImage holds one architecture,
  # and building ARM64 natively is quicker and surer than under emulation, WebKitGTK and all.
  #
  # Windows is one row building both, an installer each, the ARM64 one cross-compiled on the x64
  # runner. macOS is one row too, building for Apple silicon and for Intel one after the other, each
  # its own app: two downloads half the size of one universal app.
  platforms:
    name: Choose the platforms
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.chosen.outputs.include }}
    steps:
      - id: chosen
        env:
          ASKED: ${{ inputs.platforms }}
        run: |
          include=$(jq -c --arg asked "$ASKED" '
            ($asked | split(",") | map(select(. != ""))) as $wanted
            | [.[] | select($asked == "" or (.platform as $platform | $wanted | index($platform)))]' <<'ROWS'
          [
            {
              "name": "Windows",
              "artefact": "Windows",
              "platform": "Windows",
              "runner": "windows-2025-vs2026",
              "targets": "x86_64-pc-windows-msvc,aarch64-pc-windows-msvc",
              "installer": "apps/desktop/release/Valence-Setup-*-x64.exe",
              "also": "apps/desktop/release/Valence-Setup-*-arm64.exe"
            },
            {
              "name": "macOS",
              "artefact": "macOS",
              "platform": "macOS",
              "runner": "macos-26",
              "targets": "aarch64-apple-darwin,x86_64-apple-darwin",
              "installer": "apps/desktop/release/Valence-*-arm64.dmg",
              "also": "apps/desktop/release/Valence-*-x64.dmg"
            },
            {
              "name": "Linux",
              "artefact": "Linux",
              "platform": "Linux",
              "runner": "ubuntu-24.04",
              "targets": "x86_64-unknown-linux-gnu",
              "installer": "apps/desktop/release/Valence-*-x86_64.AppImage",
              "also": "apps/desktop/release/Valence-*-amd64.deb"
            },
            {
              "name": "Linux ARM64",
              "artefact": "Linux-ARM64",
              "platform": "Linux",
              "runner": "ubuntu-24.04-arm",
              "targets": "aarch64-unknown-linux-gnu",
              "installer": "apps/desktop/release/Valence-*-arm64.AppImage",
              "also": "apps/desktop/release/Valence-*-arm64.deb"
            }
          ]
          ROWS
          )

          if [ "$include" = "[]" ]; then
            echo "Nothing to build: tick at least one of Windows, macOS and Linux." >&2
            exit 1
          fi

          echo "include=$include" >> "$GITHUB_OUTPUT"

  # The player's own decoders for what no webview decodes, TrueHD sound and MPEG-2 pictures, built
  # from Rust to WebAssembly once, here, and shipped in every platform's app at the address the
  # player fetches them from, as the server's image ships them. One file serves every platform, and
  # compiling the TrueHD decoder takes more memory than a macOS runner has.
  decoders:
    name: Build the browser decoders
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-decoders

      - run: cargo build --release -p valence-browser-decoders --target wasm32-unknown-unknown

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-decoders
          path: target/wasm32-unknown-unknown/release/valence_browser_decoders.wasm
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build for ${{ matrix.name }}
    needs: [platforms, decoders]
    runs-on: ${{ matrix.runner }}
    env:
      IS_SIGNED: ${{ secrets.MAC_CERTIFICATE_P12 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.platforms.outputs.include) }}
    steps:
      # The tag unless told otherwise. A release cut before the packaging was written cannot build
      # its own desktop app, and `ref` is how one is built from source that can, still stamped with
      # the release's version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          persist-credentials: false

      # What Tauri builds against on Linux: WebKitGTK and GTK for the window, the indicator library
      # for the tray, and what the AppImage bundler runs. The GStreamer plugins are what the webview
      # plays video and sound with, and the AppImage carries the ones installed here, so the
      # decoders it ships are the ones listed: without libav there is no H.264 to play.
      - name: Install what Tauri builds against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-gl

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: desktop-${{ matrix.artefact }}

      # The app's own package.json says 0.0.0, since versions are cut by release-please rather than
      # written into packages. Tauri reads the app's version from that file, and the installer is
      # named for the release it belongs to, so the version is written into this checkout's copy
      # before it is built.
      #
      # A dev channel build's version names the channel, and the app reads that to follow the dev
      # channel's release rather than the newest one. The updater only takes what is newer than what
      # it is running, which is why desktop-dev.yml counts its builds up rather than naming them
      # after a commit.
      - name: Stamp the release's version on it
        shell: bash
        working-directory: apps/desktop
        run: |
          if [ -n "$TAG" ]; then
            npm pkg set version="${TAG#v}"
          elif [ -n "$DEV_VERSION" ]; then
            npm pkg set version="$DEV_VERSION"
          else
            npm pkg set version="0.0.0-dev"
          fi
        env:
          TAG: ${{ inputs.tag }}
          DEV_VERSION: ${{ inputs.dev_version }}

      # What this build adds to the app's configuration, written to a file rather than passed as JSON
      # on the command line, which PowerShell and cmd quote differently. The renderer is built once,
      # in the next step, rather than again for every target.
      #
      # A release or a dev channel build carries the updater's public key and signed update bundles,
      # and fails here, before anything is compiled, when the key is not there to sign them with. A
      # test build carries them where the key is there and goes without where it is not.
      - name: Choose whether it can be updated
        shell: bash
        run: |
          if [ -n "$TAG" ] || [ -n "$DEV_VERSION" ]; then
            if [ "$HAS_KEY" != "true" ] || [ -z "$PUBKEY" ]; then
              echo "::error title=No updater key::A release or dev channel build signs its update bundles. Set the TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets and the TAURI_UPDATER_PUBKEY variable, as desktop.yml describes."
              exit 1
            fi
            updates=true
          elif [ "$HAS_KEY" = "true" ] && [ -n "$PUBKEY" ]; then
            updates=true
          else
            updates=false
          fi

          if [ -n "$DEV_VERSION" ]; then
            feed="https://github.com/${REPO}/releases/download/desktop-dev/latest.json"
          else
            feed="https://github.com/${REPO}/releases/latest/download/latest.json"
          fi

          jq -n --argjson updates "$updates" --arg pubkey "$PUBKEY" --arg feed "$feed" '
            {build: {beforeBuildCommand: null}, bundle: {createUpdaterArtifacts: $updates}}
            + (if $updates then {plugins: {updater: {pubkey: $pubkey, endpoints: [$feed]}}} else {} end)
          ' > "$RUNNER_TEMP/tauri.ci.json"
          echo "TAURI_CI_CONFIG=$RUNNER_TEMP/tauri.ci.json" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag }}
          DEV_VERSION: ${{ inputs.dev_version }}
          REPO: ${{ github.repository }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}

      # Tauri's Windows installer runs hooks of the app's own around installing, written in NSIS,
      # the only thing it reads. They are written here from TypeScript rather than kept in the
      # repository: before installing, they run the Electron app's uninstaller where it is installed,
      # keeping its data, and after it they start the app again where the Electron app's updater
      # asked for that.
      - name: Write the installer's hooks
        if: runner.os == 'Windows'
        shell: bash
        run: |
          hooks="$RUNNER_TEMP/installer-hooks.nsh"
          pnpm --filter @valence/desktop exec tsx src/build/writeInstallerHooks.ts --out "$hooks"
          jq --arg hooks "$hooks" '.bundle.windows.nsis.installerHooks = $hooks' \
            "$TAURI_CI_CONFIG" > "$RUNNER_TEMP/tauri.ci.hooked.json"
          mv "$RUNNER_TEMP/tauri.ci.hooked.json" "$TAURI_CI_CONFIG"

      # The renderer, with the decoders built above where the player asks for them. Vite ships the
      # app's public folder as it is, so the file goes there before it builds. `tauri build` would
      # build both itself, and the configuration written above tells it not to.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-decoders
          path: ${{ runner.temp }}/browser-decoders

      - name: Build the renderer, with the decoders
        shell: bash
        run: |
          mkdir -p apps/desktop/public/decoders
          cp "$RUNNER_TEMP/browser-decoders/valence_browser_decoders.wasm" \
            apps/desktop/public/decoders/valence-browser-decoders.wasm
          pnpm --filter @valence/desktop exec vite build
          test -s apps/desktop/dist/decoders/valence-browser-decoders.wasm

      # The certificate goes into a keychain of this job's own, made and unlocked here, and Tauri is
      # told which identity in it to sign with. Tauri can make a keychain itself from the certificate
      # in APPLE_CERTIFICATE, but a keychain made for the build on current macOS runners has not
      # always unlocked, and this one is known to. The keychain and the notarising key go with the
      # runner.
      - name: Put the signing certificate in a keychain of its own
        if: matrix.name == 'macOS' && env.IS_SIGNED == 'true'
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 24)"

          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MAC_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          if [ -z "$identity" ]; then
            echo "::error title=No signing identity::The certificate in MAC_CERTIFICATE_P12 holds no Developer ID Application identity."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/notarising"
          printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/notarising/AuthKey_$ASC_KEY_ID.p8"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
        env:
          MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}

      # One build per target. Signed and notarised on macOS where the certificate was put in a
      # keychain above, which Tauri does while it bundles; otherwise built unsigned. The commit goes
      # into the host as it is compiled, for the app's About.
      - name: Build
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ] && [ "$IS_SIGNED" = "true" ]; then
            export APPLE_API_KEY="$ASC_KEY_ID"
            export APPLE_API_ISSUER="$ASC_ISSUER_ID"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/notarising/AuthKey_$ASC_KEY_ID.p8"
          fi

          VALENCE_COMMIT="$(git rev-parse --short=7 HEAD)"
          export VALENCE_COMMIT

          for target in ${TARGETS//,/ }; do
            pnpm --filter @valence/desktop exec tauri build --target "$target" --config "$TAURI_CI_CONFIG"
          done
        env:
          TARGETS: ${{ matrix.targets }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # A signature that is there but wrong fails here rather than on somebody's Mac: every app
      # built is checked, and Gatekeeper is asked whether it would open it.
      - name: Check the signature
        if: matrix.name == 'macOS' && env.IS_SIGNED == 'true'
        shell: bash
        run: |
          for app in target/*-apple-darwin/release/bundle/macos/Valence.app; do
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose "$app"
          done

      # Tauri names its bundles `Valence_<version>_<arch>` in a folder per target and per kind. They
      # are gathered into one folder under the names the installers have always had, each with the
      # updater's signature beside it where there is one. The signature is over the file's contents,
      # so a new name leaves it good.
      #
      # On macOS the signed .app is zipped as well, with ditto, as the Electron app's builder zipped
      # it: that .zip is what an Electron copy's updater installs this app from.
      - name: Gather the installers
        shell: bash
        run: |
          version="$(jq -r .version apps/desktop/package.json)"
          out=apps/desktop/release
          mkdir -p "$out"

          take() {
            local name="$1" needed="$2"
            shift 2
            if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
              if [ "$needed" = "needed" ]; then
                echo "::error title=No bundle::Expected one file to hand over as $name, and found: $*"
                exit 1
              fi
              return 0
            fi
            cp "$1" "$out/$name"
            if [ -f "$1.sig" ]; then
              cp "$1.sig" "$out/$name.sig"
            fi
          }

          for target in ${TARGETS//,/ }; do
            bundle="target/$target/release/bundle"
            case "$target" in
              aarch64-apple-darwin)
                take "Valence-$version-arm64.dmg" needed "$bundle"/dmg/*.dmg
                take "Valence-$version-arm64.app.tar.gz" optional "$bundle"/macos/*.app.tar.gz ;;
              x86_64-apple-darwin)
                take "Valence-$version-x64.dmg" needed "$bundle"/dmg/*.dmg
                take "Valence-$version-x64.app.tar.gz" optional "$bundle"/macos/*.app.tar.gz ;;
              x86_64-pc-windows-msvc)
                take "Valence-Setup-$version-x64.exe" needed "$bundle"/nsis/*-setup.exe ;;
              aarch64-pc-windows-msvc)
                take "Valence-Setup-$version-arm64.exe" needed "$bundle"/nsis/*-setup.exe ;;
              x86_64-unknown-linux-gnu)
                take "Valence-$version-x86_64.AppImage" needed "$bundle"/appimage/*.AppImage
                take "Valence-$version-amd64.deb" needed "$bundle"/deb/*.deb ;;
              aarch64-unknown-linux-gnu)
                take "Valence-$version-arm64.AppImage" needed "$bundle"/appimage/*.AppImage
                take "Valence-$version-arm64.deb" needed "$bundle"/deb/*.deb ;;
              *)
                echo "::error title=Unknown target::Nothing says what to hand over for $target."
                exit 1 ;;
            esac
          done

          zip_the_app() {
            local name="$1"
            shift
            if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
              echo "::error title=No app::Expected one app to zip as $name, and found: $*"
              exit 1
            fi
            ditto -c -k --sequesterRsrc --keepParent "$1" "$out/$name"
          }

          for target in ${TARGETS//,/ }; do
            bundle="target/$target/release/bundle"
            case "$target" in
              aarch64-apple-darwin)
                zip_the_app "Valence-$version-arm64-mac.zip" "$bundle"/macos/*.app ;;
              x86_64-apple-darwin)
                zip_the_app "Valence-$version-x64-mac.zip" "$bundle"/macos/*.app ;;
            esac
          done

          ls -l "$out"
        env:
          TARGETS: ${{ matrix.targets }}

      - name: Hand over the installer on its own
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.installer }}
          archive: false
          if-no-files-found: error

      - name: Hand over the other installer on its own
        if: matrix.also != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.also }}
          archive: false
          if-no-files-found: error

      - name: Hand over everything, for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valence-desktop-${{ matrix.artefact }}
          path: apps/desktop/release/
          if-no-files-found: error

  # The updater's manifest, latest.json, written once every platform is built: one file names every
  # platform's bundle, so no one build can write it. The Electron app's feeds are written beside it,
  # from the installers, the .zip and the AppImages. Only for a release or a dev channel build, whose
  # bundles are signed and whose downloads have an address to point at: the release's tag, or the dev
  # channel's `desktop-dev`. Handed over as an artefact named like the platforms', so release.yml and
  # desktop-dev.yml hang it on the release with everything else.
  manifest:
    name: Write the update manifest
    needs: build
    if: inputs.tag != '' || inputs.dev_version != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: valence-desktop-*
          merge-multiple: true
          path: release

      - name: Write latest.json
        run: |
          mkdir -p "$RUNNER_TEMP/manifest"

          if [ -n "$TAG" ]; then
            release=(--version "${TAG#v}" --tag "$TAG")
          else
            release=(--version "$DEV_VERSION" --dev)
          fi

          pnpm --filter @valence/desktop exec tsx src/build/writeUpdateManifest.ts \
            --folder "$GITHUB_WORKSPACE/release" \
            --repository "$GITHUB_REPOSITORY" \
            --out "$RUNNER_TEMP/manifest/latest.json" \
            "${release[@]}"

          cat "$RUNNER_TEMP/manifest/latest.json"
        env:
          TAG: ${{ inputs.tag }}
          DEV_VERSION: ${{ inputs.dev_version }}

      - name: Write the Electron app's feeds
        run: |
          if [ -n "$TAG" ]; then
            release=(--version "${TAG#v}")
          else
            release=(--version "$DEV_VERSION" --dev)
          fi

          pnpm --filter @valence/desktop exec tsx src/build/writeElectronFeeds.ts \
            --folder "$GITHUB_WORKSPACE/release" \
            --out "$RUNNER_TEMP/manifest" \
            "${release[@]}"

          for feed in "$RUNNER_TEMP"/manifest/*.yml; do
            echo "::group::$(basename "$feed")"
            cat "$feed"
            echo "::endgroup::"
          done
        env:
          TAG: ${{ inputs.tag }}
          DEV_VERSION: ${{ inputs.dev_version }}

      - name: Hand over the manifest, for the release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valence-desktop-manifest
          path: ${{ runner.temp }}/manifest/
          if-no-files-found: error
