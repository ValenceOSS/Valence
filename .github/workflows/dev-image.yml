name: Dev image

# Builds the images from main every time something is merged, so what has just landed can be pulled
# and tried without waiting for a release.
#
# A dev image is tagged for the release it is on the way to — `0.3.1-dev` — and moves with every
# merge until that release is cut, alongside `dev`, which always means the newest, and `sha-3a2e85d`,
# which is that one commit. It is never `latest`: that tag belongs to a release and to nothing else,
# so a server following it cannot be moved onto unreleased code by a merge. The release itself is
# built by release.yml, and an image somebody asked for by hand from a pull request by
# nightly-image.yml.
#
# Unlike ci.yml this runs on its own. That workflow is held back because it costs real minutes; this
# repository is public, so Actions minutes are free and an image that only exists when somebody
# remembers to press a button is worse than one that is always current.

# Skipped for a push that changes only what the image does not contain: the documentation and landing
# sites, notes, and the workflows that belong to other pipelines. Anything else, this file included,
# builds.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
      - 'apps/metrics/**'
      - '.github/workflows/metrics.yml'
      - '**/*.md'
      - '.github/workflows/nightly-image.yml'
      - '.github/workflows/prune-images.yml'
      - '.github/workflows/media-pipeline.yml'
      - '.github/workflows/desktop-dev.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-please.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'

concurrency:
  group: dev-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Work out the next version
    uses: ./.github/workflows/next-version.yml
    permissions:
      contents: read
      pull-requests: read

  image:
    name: Image (${{ matrix.image.name }})
    needs: version
    # Two images from one repository: Valence itself, and the optional requests service beside it.
    # Each is built on runners of its own with caches of its own, since they share nothing but
    # contracts.
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: valence
            file: docker/server.Dockerfile
            title: Valence
            description: A self-hosted streaming platform
          - name: valence-requests
            file: apps/requests/Dockerfile
            title: Valence requests
            description: The optional service that finds and downloads what Valence is asked for

    permissions:
      contents: read
      packages: write

    uses: ./.github/workflows/image.yml
    with:
      name: ${{ matrix.image.name }}
      file: ${{ matrix.image.file }}
      title: ${{ matrix.image.title }} (dev)
      description: An unreleased build of main, for testing
      ref: ${{ github.sha }}
      tags: |
        type=raw,value=${{ needs.version.outputs.next }}-dev
        type=raw,value=dev
        type=sha,format=short
      # The commit goes into the version the server reports, so a bug filed against a dev image names
      # a build that can be found rather than the same `1.0.0-dev` every push produces.
      version: ${{ needs.version.outputs.next }}-dev
      commit-in-version: true
