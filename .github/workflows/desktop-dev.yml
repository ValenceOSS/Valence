name: Desktop dev channel

# Builds the desktop app from main every time something is merged, and hangs it on the dev channel's
# release, so a desktop app installed from there updates itself to whatever has just landed — the
# desktop app's equivalent of the `dev` image.
#
# The channel is one release, tagged `desktop-dev` and marked as a prerelease, which every build
# replaces with a release of its own: the installers, and the dev.yml, dev-mac.yml and dev-linux*.yml
# the app reads to find them. A dev build is stamped with the dev channel's address when it is built
# (see desktop.yml), so it follows this release and nothing else; a released build follows the
# newest release, which a prerelease never is. Nothing else in the repository answers to a tag that
# does not start with `v`, so moving this one starts nothing.
#
# A build is named for the release it is on the way to and counted up from there: `1.4.0-dev.12`.
# The count is what lets one dev build see the next as newer, which a commit hash cannot say, and
# naming it for the next release keeps it ahead of the last one. The commit it was built from is in
# the app's About, and at the top of the release.
#
# The release's notes are GitHub's own, written from the pull requests merged since the last
# release, as a release's are: everything the next release would carry so far.
#
# Skipped for a push that changes only what the app does not contain, as dev-image.yml is.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'apps/docs/**'
      - 'apps/landing/**'
      - 'apps/server/**'
      - 'apps/requests/**'
      - 'apps/transcoder/**'
      - 'apps/mobile/**'
      - 'apps/tv/**'
      - '**/*.md'
      - '.github/workflows/dev-image.yml'
      - '.github/workflows/nightly-image.yml'
      - '.github/workflows/prune-images.yml'
      - '.github/workflows/media-pipeline.yml'
      - '.github/workflows/phone-testflight.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-please.yml'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Work out the next version
    uses: ./.github/workflows/next-version.yml
    permissions:
      contents: read
      pull-requests: read

  # A newer merge makes a build under way pointless, so it cancels it, and a build started by hand
  # from a branch cancels only builds of that branch. Publishing is never
  # cancelled: it moves the tag and replaces the files one at a time, and stopping it partway would
  # leave the channel naming a build it no longer holds. A publish that is running finishes, and the
  # next waits for it.
  desktop:
    name: Desktop app
    needs: version
    concurrency:
      group: desktop-dev-build-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      dev_version: ${{ needs.version.outputs.next }}-dev.${{ github.run_number }}

  # Only main is published, so starting this by hand from a branch builds the installers without
  # moving everybody on the dev channel onto that branch.
  publish:
    name: Publish to the dev channel
    needs: [version, desktop]
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: desktop-dev-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CHANNEL: desktop-dev
      VERSION: ${{ needs.version.outputs.next }}-dev.${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: valence-desktop-*
          merge-multiple: true
          path: release

      # The tag is moved first, so the notes are written up to this build. GitHub writes them up to
      # wherever the tag already stands, and written before it moved they stopped one build short.
      # It is moved before anything is uploaded too, so the release never names one commit while
      # holding another's installers for longer than the upload takes.
      - name: Point the channel at this commit
        run: |
          git tag -f "$CHANNEL" "$GITHUB_SHA"
          git push -f origin "refs/tags/$CHANNEL"

      - name: Write the notes
        run: |
          last="v$(jq -r '.["."]' .release-please-manifest.json)"
          merged="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$CHANNEL" \
            -f target_commitish="$GITHUB_SHA" \
            -f previous_tag_name="$last" \
            -q .body)"

          {
            echo "**Valence ${VERSION}, a development build of main at \`${GITHUB_SHA::7}\`.** Not a release: it can break, and it updates itself to the next build of main."
            echo
            echo "Install it once from here and it keeps itself up to date. Go back to releases by installing the latest release over it."
            echo
            echo "${merged}"
          } > notes.md

      # Every build is a release of its own, made as a draft, filled, and only then put in place of the
      # last one. GitHub lists releases by when they were published, so a release that was only ever
      # edited stayed where it was first published and sank below every release cut after it; one
      # published now stays at the top. A draft is seen by nobody and an app reads the published
      # release, so the last build is whole until the moment it is swapped, and the swap is two calls.
      # A draft left by a run that failed partway is thrown away first, so they cannot pile up.
      - name: Fill a draft with this build
        run: |
          releases="repos/$GITHUB_REPOSITORY/releases"

          gh api --paginate "$releases" \
            -q ".[] | select(.draft and .tag_name == \"$CHANNEL\") | .id" | while read -r stale; do
            gh api -X DELETE "$releases/$stale"
          done

          draft="$(gh api -X POST "$releases" \
            -f tag_name="$CHANNEL" \
            -F draft=true \
            -F prerelease=true \
            -f make_latest=false \
            -f name="Development build" \
            -F body=@notes.md \
            -q .id)"
          echo "DRAFT=$draft" >> "$GITHUB_ENV"

          find release -type f -print0 | while IFS= read -r -d '' file; do
            name="$(jq -rn --arg name "$(basename "$file")" '$name | @uri')"
            curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@$file" \
              "https://uploads.github.com/$releases/$draft/assets?name=$name" > /dev/null
          done

      - name: Put it in place of the last build
        run: |
          releases="repos/$GITHUB_REPOSITORY/releases"
          was="$(gh api "$releases/tags/$CHANNEL" -q .id 2> /dev/null || true)"

          if [ -n "$was" ]; then
            gh api -X DELETE "$releases/$was"
          fi

          gh api -X PATCH "$releases/$DRAFT" -F draft=false -f make_latest=false > /dev/null

      # Should anything fail between making the draft and publishing it, the channel is left with a
      # published release either way: the last build, with the draft thrown away, or, where the last
      # build was already gone, this one.
      - name: Leave the channel with a release
        if: failure() && env.DRAFT != ''
        run: |
          releases="repos/$GITHUB_REPOSITORY/releases"

          if gh api "$releases/tags/$CHANNEL" > /dev/null 2>&1; then
            gh api -X DELETE "$releases/$DRAFT"
          else
            gh api -X PATCH "$releases/$DRAFT" -F draft=false -f make_latest=false > /dev/null
          fi

      - name: Say where it went
        run: |
          {
            echo "### Published ${VERSION} to the dev channel"
            echo
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${CHANNEL}"
          } >> "$GITHUB_STEP_SUMMARY"
