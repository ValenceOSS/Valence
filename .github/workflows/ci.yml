name: CI

# The gate every change goes through, on every push and every pull request, so a branch that cannot
# merge says so before anybody reviews it.
#
# Two stages. Build compiles every package something else depends on, exactly once, and saves what
# turbo produced. Lint, typecheck and every test job then restore that and run against it. The
# `^build` each of their tasks depends on is answered from the cache rather than compiled again, so
# nothing after the build stage rebuilds anything.
#
# One build job rather than one per package, deliberately. The packages form a chain — contracts,
# then core, then client, then screens — and a job per link would wait on the link before it, paying
# a runner's checkout and install at every step of a graph that compiles end to end in seconds. Each
# package's build is still its own turbo task with its own block in the log; they share a runner
# because splitting them would cost minutes to save seconds.
#
# The large suites are sharded, each shard on a runner of its own: @valence/screens six ways,
# @valence/server four and @valence/client three, with @valence/ui as a single shard in the same
# matrix. The small packages share one runner, two at a time, because each of
# them spends longer installing than testing and a runner apiece queued the large shards behind
# them. Two at a time rather than all at once: turbo and vitest each size their worker pool to the
# machine's CPU count, and every package at once on a handful of cores thrashes.
#
# Test results outlive the run. Turbo already caches a passing test task by its inputs, and each
# test job keeps those results in the Actions cache and restores them next time, so a package or a
# shard whose code and dependencies have not changed replays its last pass in seconds.
#
# Every job after the first sits out the changes that cannot affect it. The first job asks the
# workspace which packages a pull request touches, counting the packages that depend on them, and
# the rest read its answer: a change to the docs site runs the docs tests and nothing else, a change
# to the transcoder runs Rust and nothing else, and a change to the root configuration, or a push to
# main, runs everything.
#
# The media pipeline is deliberately not here. It wants a Debian container, a Rust build and three
# minutes of encoding, and lives in media-pipeline.yml to run when it earns its keep.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree a change touches, so the jobs that only answer for one of them can sit
  # out the changes that cannot affect them. A push to main answers yes to everything: main is what
  # releases are cut from, and a cheap job skipped there saves a minute and risks the thing every
  # other rule here exists to prevent.
  #
  # The workspace answers which packages are affected, counting the ones that depend on a changed
  # one, so this file holds no list of who depends on whom to keep in step with the packages. It
  # needs the history to compare against but not an install, which is what makes it cheap enough
  # to be worth asking. A change to a file at the root, other than the notes and the workflows that
  # belong to other pipelines, reads as touching the workspace itself, and that runs everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.what.outputs.code }}
      light: ${{ steps.what.outputs.light }}
      shards: ${{ steps.what.outputs.shards }}
      rust: ${{ steps.what.outputs.rust }}
      native: ${{ steps.what.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - id: what
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          testable='["@valence/i18n","@valence/contracts","@valence/core","@valence/plugin-sdk","@valence/lint","@valence/brand","@valence/transcoder","@valence/ui","@valence/client","@valence/server","@valence/requests","@valence/database","@valence/web","@valence/desktop","@valence/landing","@valence/docs"]'

          if [ "$EVENT" != "pull_request" ]; then
            {
              echo 'code=true'
              echo 'rust=true'
              echo 'native=true'
            } >> "$GITHUB_OUTPUT"
            packages="$testable"
            screens=true
          else
            git fetch --no-tags origin "$BASE"

            affected=$(pnpm ls --filter "...[origin/$BASE]" --depth -1 --json \
              --changed-files-ignore-pattern='**/*.md' \
              --changed-files-ignore-pattern='.github/workflows/dev-image.yml' \
              --changed-files-ignore-pattern='.github/workflows/nightly-image.yml' \
              --changed-files-ignore-pattern='.github/workflows/prune-images.yml' \
              --changed-files-ignore-pattern='.github/workflows/media-pipeline.yml' \
              --changed-files-ignore-pattern='.github/workflows/desktop.yml' \
              --changed-files-ignore-pattern='.github/workflows/desktop-dev.yml' \
              --changed-files-ignore-pattern='.github/workflows/next-version.yml' \
              --changed-files-ignore-pattern='.github/workflows/release.yml' \
              --changed-files-ignore-pattern='.github/workflows/release-please.yml' \
              --changed-files-ignore-pattern='release-please-config.json' \
              --changed-files-ignore-pattern='.release-please-manifest.json' \
              | jq -r '.[].name')
            echo "$affected"

            if echo "$affected" | grep -qx 'valence'; then
              echo 'code=true' >> "$GITHUB_OUTPUT"
              packages="$testable"
              screens=true
            else
              if echo "$affected" | grep -vx '@valence/transcoder' | grep -q .; then
                echo 'code=true' >> "$GITHUB_OUTPUT"
              else
                echo 'code=false' >> "$GITHUB_OUTPUT"
              fi
              packages=$(echo "$affected" | jq -R . | jq -sc --argjson testable "$testable" '[.[] | select(. as $name | $testable | index($name))]')
              screens=$(echo "$affected" | grep -qx '@valence/screens' && echo true || echo false)
            fi

            changed=$(git diff --name-only "origin/$BASE...HEAD")

            if echo "$changed" | grep -qE '^(apps/transcoder/|apps/desktop/native/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
              echo 'rust=true' >> "$GITHUB_OUTPUT"
            else
              echo 'rust=false' >> "$GITHUB_OUTPUT"
            fi

            if echo "$changed" | grep -qE '^(apps/desktop/native/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
              echo 'native=true' >> "$GITHUB_OUTPUT"
            else
              echo 'native=false' >> "$GITHUB_OUTPUT"
            fi
          fi

          # The large suites, each split into the shards its size calls for, and the rest for the
          # one runner the small packages share.
          sharded='{"@valence/server":4,"@valence/client":3,"@valence/ui":1}'
          {
            echo "light=$(echo "$packages" | jq -c --argjson sharded "$sharded" '[.[] | select(. as $name | $sharded | has($name) | not)]')"
            echo "shards=$(echo "$packages" | jq -c --argjson sharded "$sharded" --arg screens "$screens" '
              [ (.[] | select(. as $name | $sharded | has($name)) | . as $name | range(1; $sharded[$name] + 1) | {package: $name, shard: ., of: $sharded[$name]}),
                (if $screens == "true" then range(1; 7) | {package: "@valence/screens", shard: ., of: 6} else empty end) ]')"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build shared packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every package some other package's typecheck or test task needs as a `^build` dependency.
      # Never a leaf app: nothing depends on one, and building one here would be waste (for
      # `apps/web` today it would also surface a real but unrelated strictness gap between its own
      # build and its typecheck script, worth its own fix).
      - run: >-
          pnpm turbo run build
          --filter=@valence/i18n
          --filter=@valence/contracts
          --filter=@valence/core
          --filter=@valence/plugin-sdk
          --filter=@valence/ui
          --filter=@valence/client
          --filter=@valence/screens

      # Keyed on the commit rather than on source hashes: this cache only has to outlive the jobs in
      # this one run, every one of which wants exactly what this commit built.
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}

  # Lint and typecheck share a runner. Lint needs no build and could start sooner, but a runner of
  # its own held a slot through the minute the test shards all want one at once.
  typecheck:
    name: Lint, typecheck and migration check
    needs: [changes, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          fail-on-cache-miss: true

      - run: pnpm lint

      - run: pnpm format:check

      # A hand-written migration with no snapshot beside it leaves generation silent and recreating
      # tables that already exist. See VAL-193.
      - run: pnpm db:check

      - run: pnpm typecheck

  # Every small package on one runner, two at a time.
  test:
    name: Test the smaller packages
    needs: [changes, build]
    if: needs.changes.outputs.light != '[]'
    runs-on: ubuntu-24.04
    env:
      PACKAGES: ${{ needs.changes.outputs.light }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/test-results
          key: turbo-tests-light-${{ github.sha }}
          restore-keys: turbo-tests-light-

      - run: cp -n .turbo/test-results/* .turbo/cache/ 2>/dev/null || true

      - run: pnpm turbo run test --concurrency=2 $(echo "$PACKAGES" | jq -r '.[] | "--filter=" + .')

      # Only this job's own test results are kept, by the hashes turbo gave them, rather than the
      # whole cache with every build in it.
      - name: Keep the test results
        run: |
          rm -rf .turbo/test-results && mkdir -p .turbo/test-results
          for hash in $(pnpm turbo run test $(echo "$PACKAGES" | jq -r '.[] | "--filter=" + .') --dry=json | jq -r '.tasks[] | select(.task == "test") | .hash'); do
            cp .turbo/cache/"$hash"* .turbo/test-results/ 2>/dev/null || true
          done

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/test-results
          key: turbo-tests-light-${{ github.sha }}

  # Each shard is its own turbo task, told which shard it is through VITEST_SHARD, which turbo
  # folds into that task's hash alone. Passing the shard as an argument instead put it into the
  # hash of every build the test depended on, and each runner rebuilt them all rather than taking
  # them from the build job's cache.
  test-shards:
    name: Test ${{ matrix.package }} (${{ matrix.shard }} of ${{ matrix.of }})
    needs: [changes, build]
    if: needs.changes.outputs.shards != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.shards) }}
    env:
      VITEST_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/test-results
          key: turbo-tests-${{ matrix.package }}-${{ matrix.shard }}-of-${{ matrix.of }}-${{ github.sha }}
          restore-keys: turbo-tests-${{ matrix.package }}-${{ matrix.shard }}-of-${{ matrix.of }}-

      - run: cp -n .turbo/test-results/* .turbo/cache/ 2>/dev/null || true

      - run: pnpm turbo run test:shard --filter=${{ matrix.package }}

      - name: Keep the test results
        run: |
          rm -rf .turbo/test-results && mkdir -p .turbo/test-results
          for hash in $(pnpm turbo run test:shard --filter=${{ matrix.package }} --dry=json | jq -r '.tasks[] | select(.task == "test:shard") | .hash'); do
            cp .turbo/cache/"$hash"* .turbo/test-results/ 2>/dev/null || true
          done

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/test-results
          key: turbo-tests-${{ matrix.package }}-${{ matrix.shard }}-of-${{ matrix.of }}-${{ github.sha }}

  rust:
    name: Rust format, lint and test
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # Read only, since cargo runs build scripts from every crate it builds and nothing here writes.
    permissions:
      contents: read
    # On the pull requests that touch Rust, and on every push to main. A test reading a child's
    # niceness through `ps` once passed on every developer's macOS and failed only here, so the unit
    # tests are worth running somewhere other than the machine they were written on.
    #
    # The suites that drive a real FFmpeg do not run here. They took nine of this job's ten minutes,
    # most of it encoding fixtures, and they need a Debian container with the FFmpeg Valence ships.
    # They run in media-pipeline.yml instead, by hand before a release and once a week, and in the
    # pre-push hook. What is left needs no FFmpeg at all, as the Windows job below already shows.
    steps:
      # Nothing here pushes, and cargo runs build scripts from every crate in the workspace, so the
      # token is not left behind in the checkout for them to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - run: cargo test --workspace --lib --bins

      - run: cargo test -p valence-transcoder --test path_map_requests

  # The transcoder also runs natively on Windows, where it reaches the GPU through Direct3D 11 rather
  # than through /dev/dri (VAL-338). The Linux job cannot see a Windows-only compile error, a path
  # that splits on the drive's colon, or a test that assumes a forward slash, so it is linted and its
  # unit tests run here too, on the same pull requests as the Linux job. The suites that drive a real
  # FFmpeg stay on Linux: there is no Valence FFmpeg for this runner to fetch from a package.
  # On x64 and on Windows on Arm, each natively, so a compile error only one architecture has shows
  # up on the pull request rather than in a release (VAL-355).
  transcoder-windows:
    name: Transcoder on Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy -p valence-transcoder --all-targets -- -D warnings

      - run: cargo test -p valence-transcoder --lib --bins --test path_map_requests

  # The Rust job builds on Linux, where the desktop app's native module holds nothing but a helper.
  # Its Windows Hello code only compiles on Windows, so it is linted and built there, on the pull
  # requests that touch it.
  #
  # On both of Windows' architectures, as the transcoder is: the desktop app ships an ARM64 build too.
  desktop-native:
    name: Desktop native module on Windows (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: changes
    if: needs.changes.outputs.native == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-arm
    steps:
      # Nothing here pushes, and cargo runs build scripts from every crate it builds, so the token
      # is not left behind in the checkout for them to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo clippy -p valence-desktop-native --all-targets -- -D warnings

      - run: cargo test -p valence-desktop-native

      - run: cargo build --release -p valence-desktop-native
