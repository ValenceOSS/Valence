name: CI

# The gate every change goes through, on every push and every pull request, so a branch that cannot
# merge says so before anybody reviews it.
#
# Three stages. Lint needs no build and starts at once. Build compiles every package something else
# depends on, exactly once, and saves what turbo produced. Typecheck and every test job then restore
# that and run against it — the `^build` each of their tasks depends on is answered from the cache
# rather than compiled again, so nothing after the build stage rebuilds anything.
#
# One build job rather than one per package, deliberately. The packages form a chain — contracts,
# then core, then client, then screens — and a job per link would wait on the link before it, paying
# a runner's checkout and install at every step of a graph that compiles end to end in seconds. Each
# package's build is still its own turbo task with its own block in the log; they share a runner
# because splitting them would cost minutes to save seconds.
#
# Tests run one package per runner. Turbo and vitest each size their worker pool to the machine's
# CPU count, and a GitHub-hosted runner has a handful of cores — every package at once on one box
# oversubscribes it many times over, which is thrashing rather than parallelism. @valence/screens
# goes further and is sharded four ways: it is the one package on jsdom rather than plain Node, and
# its 491 files kept climbing well past where everything else, @valence/server's larger suite
# included, had finished and stayed flat.
#
# Every job after the first sits out the changes that cannot affect it. The first job asks the
# workspace which packages a pull request touches, counting the packages that depend on them, and
# the rest read its answer: a change to the docs site runs the docs tests and nothing else, a change
# to the transcoder runs Rust and nothing else, and a change to the root configuration, or a push to
# main, runs everything.
#
# The media pipeline is deliberately not here. It wants a Debian container, a Rust build and three
# minutes of encoding, and lives in media-pipeline.yml to run when it earns its keep.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree a change touches, so the jobs that only answer for one of them can sit
  # out the changes that cannot affect them. A push to main answers yes to everything: main is what
  # releases are cut from, and a cheap job skipped there saves a minute and risks the thing every
  # other rule here exists to prevent.
  #
  # The workspace answers which packages are affected, counting the ones that depend on a changed
  # one, so this file holds no list of who depends on whom to keep in step with the packages. It
  # needs the history to compare against but not an install, which is what makes it cheap enough
  # to be worth asking. A change to a file at the root, other than the notes and the workflows that
  # belong to other pipelines, reads as touching the workspace itself, and that runs everything.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
      packages: ${{ steps.what.outputs.packages }}
      screens: ${{ steps.what.outputs.screens }}
      rust: ${{ steps.what.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - id: what
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          testable='["@valence/contracts","@valence/core","@valence/plugin-sdk","@valence/tools","@valence/ui","@valence/client","@valence/server","@valence/requests","@valence/web","@valence/desktop","@valence/landing","@valence/docs"]'

          if [ "$EVENT" != "pull_request" ]; then
            {
              echo 'code=true'
              echo "packages=$testable"
              echo 'screens=true'
              echo 'rust=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$BASE"

          affected=$(pnpm ls --filter "...[origin/$BASE]" --depth -1 --json \
            --changed-files-ignore-pattern='**/*.md' \
            --changed-files-ignore-pattern='.github/workflows/dev-image.yml' \
            --changed-files-ignore-pattern='.github/workflows/nightly-image.yml' \
            --changed-files-ignore-pattern='.github/workflows/prune-images.yml' \
            --changed-files-ignore-pattern='.github/workflows/media-pipeline.yml' \
            --changed-files-ignore-pattern='.github/workflows/release.yml' \
            --changed-files-ignore-pattern='.github/workflows/release-please.yml' \
            --changed-files-ignore-pattern='release-please-config.json' \
            --changed-files-ignore-pattern='.release-please-manifest.json' \
            | jq -r '.[].name')
          echo "$affected"

          if echo "$affected" | grep -qx 'valence'; then
            {
              echo 'code=true'
              echo "packages=$testable"
              echo 'screens=true'
            } >> "$GITHUB_OUTPUT"
          else
            if echo "$affected" | grep -vx '@valence/transcoder' | grep -q .; then
              echo 'code=true' >> "$GITHUB_OUTPUT"
            else
              echo 'code=false' >> "$GITHUB_OUTPUT"
            fi
            echo "packages=$(echo "$affected" | jq -R . | jq -sc --argjson testable "$testable" '[.[] | select(. as $name | $testable | index($name))]')" >> "$GITHUB_OUTPUT"
            echo "screens=$(echo "$affected" | grep -qx '@valence/screens' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

          changed=$(git diff --name-only "origin/$BASE...HEAD")

          if echo "$changed" | grep -qE '^(apps/transcoder/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yml$)'; then
            echo 'rust=true' >> "$GITHUB_OUTPUT"
          else
            echo 'rust=false' >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint and migration check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # A hand-written migration with no snapshot beside it leaves generation silent and recreating
      # tables that already exist. See VAL-193.
      - run: pnpm db:check

  build:
    name: Build shared packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every package some other package's typecheck or test task needs as a `^build` dependency.
      # Never a leaf app: nothing depends on one, and building one here would be waste (for
      # `apps/web` today it would also surface a real but unrelated strictness gap between its own
      # build and its typecheck script, worth its own fix).
      - run: >-
          pnpm turbo run build
          --filter=@valence/contracts
          --filter=@valence/core
          --filter=@valence/plugin-sdk
          --filter=@valence/ui
          --filter=@valence/client
          --filter=@valence/screens

      # Keyed on the commit rather than on source hashes: this cache only has to outlive the jobs in
      # this one run, every one of which wants exactly what this commit built.
      - uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}

  typecheck:
    name: Typecheck
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          fail-on-cache-miss: true

      - run: pnpm typecheck

  test:
    name: Test ${{ matrix.package }}
    needs: [changes, build]
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          fail-on-cache-miss: true

      - run: pnpm turbo run test --filter=${{ matrix.package }}

  test-screens:
    name: Test @valence/screens (shard ${{ matrix.shard }} of 4)
    needs: [changes, build]
    if: needs.changes.outputs.screens == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}
          fail-on-cache-miss: true

      # In two steps rather than `turbo run test -- --shard=…`. Turbo folds pass-through arguments
      # into its hash, so a test run carrying a shard argument never matches what the build job
      # cached and rebuilt every dependency itself. Restoring the builds through turbo with no extra
      # arguments answers every one of them from the cache; vitest then takes the shard directly.
      - run: pnpm turbo run build --filter=@valence/screens

      - run: pnpm --filter @valence/screens exec vitest run --shard=${{ matrix.shard }}/4

  rust:
    name: Rust format, lint and test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    # On pull requests as well, which it did not used to be. The case for skipping them was that the
    # pre-push hook has already run cargo clippy and cargo test on the machine the change was
    # written on — which is true, and the machine is exactly the problem. A test reading a child's
    # niceness through `ps` passed on every developer's macOS and failed here, where the image
    # carries no procps, and nothing anybody could run locally would have said otherwise. The break
    # then sat on main until somebody looked, because after the merge is the first time anything
    # ran it.
    #
    # On the pull requests that touch it, though, rather than on all of them. Pulling a Debian image
    # and building the crate is minutes, and a change with no Rust in it cannot break Rust — a stack
    # of web pull requests paid for that over and over and learnt nothing from any of it. A push to
    # main runs it regardless, so what releases are cut from is still known to be good.

    # In Debian, against the FFmpeg Valence ships, because these tests decode rather than merely
    # calling something that does. One of them scribbles over the middle of a clip and requires the
    # decoder to notice; Ubuntu's 6.1.1 decodes the damage without complaint and the test fails,
    # which says nothing about Valence and everything about which FFmpeg was asked. Testing the
    # transcoder against a build that ships to nobody answers a question nobody has.
    #
    # The shipped build is packaged for Debian and wants libraries Ubuntu noble does not carry, so
    # the container is what makes running the real thing possible at all.
    container:
      image: debian:bookworm-slim
    env:
      VALENCE_FFMPEG_VERSION: 8.1.2-5.2
      VALENCE_FFMPEG_SUITE: bookworm
      VALENCE_FFMPEG: /usr/lib/valence-ffmpeg/ffmpeg
      VALENCE_FFPROBE: /usr/lib/valence-ffmpeg/ffprobe
    steps:
      # Nothing is in a slim image, including what checkout needs to clone with. The corpus tools
      # are deliberately absent: cargo test shells out to FFmpeg and nothing else.
      - name: Everything the image does not carry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential pkg-config

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Before FFmpeg is fetched, so a formatting slip is not made to wait on a download.
      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - name: Install the FFmpeg Valence ships
        run: |
          curl -fsSL -o /tmp/valence-ffmpeg.deb \
            "https://github.com/ValenceOSS/valence-ffmpeg/releases/download/v${VALENCE_FFMPEG_VERSION}/valence-ffmpeg_${VALENCE_FFMPEG_VERSION}-${VALENCE_FFMPEG_SUITE}_amd64.deb"
          apt-get install -y --no-install-recommends /tmp/valence-ffmpeg.deb
          "$VALENCE_FFMPEG" -version | head -1
          # On the path as well as in the variables. The package installs beside the system's own
          # FFmpeg rather than as it, and a slim image has none, so a test reaching for the bare
          # name finds nothing.
          ln -sf "$VALENCE_FFMPEG" /usr/local/bin/ffmpeg
          ln -sf "$VALENCE_FFPROBE" /usr/local/bin/ffprobe

      # The corpus is deliberately not generated here. The suites that need one look for it and skip
      # when it is absent, and building it is the three minutes that belongs in media-pipeline.yml.
      - run: cargo test
