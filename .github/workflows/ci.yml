name: CI

# The gate every change goes through. Lint, types, the schema snapshot and the whole test suite, on
# every push and every pull request, so a branch that cannot merge says so before anybody reviews it.
#
# What is deliberately not here is the media pipeline. That job wants a Debian container, a Rust
# build and three minutes of encoding against the FFmpeg Valence ships, which is well over ten
# minutes of waiting — too slow to put in front of every push, and it lives in media-pipeline.yml to
# be run when it earns its keep: before a release, and after touching the transcoder.
#
# Tests run one package per runner rather than `pnpm test` on a single box. Turbo and vitest each
# size their own worker pool to the machine's CPU count, and a single GitHub-hosted runner has only a
# handful of cores — a dozen packages doing that at once oversubscribes it many times over, which is
# slow thrashing rather than fast parallelism. A runner per package gets a full machine to itself and
# nothing else's tests to share memory with, so the whole matrix finishes in whichever one package
# takes longest rather than in the sum of all of them.
#
# The build that every package's test task depends on happens exactly once, in its own job, rather
# than once per matrix leg. With no remote cache configured, each leg cold-building core, contracts,
# ui and client from scratch was the difference between "one build" and "up to eleven of them" for the
# same unchanged output — and asked to do that concurrently across eleven fresh runners, at least one
# of them reliably sat at `tsc --build` for ten minutes and further without producing a single line of
# output, on more than one fresh attempt. Building once and handing every test job the same `dist/**`
# through actions/cache, keyed on this run's commit, sidesteps the redundant work entirely rather than
# explaining exactly what those concurrent cold builds were doing to each other.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, types and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # A hand-written migration with no snapshot beside it leaves generation silent and recreating
      # tables that already exist. See VAL-193.
      - run: pnpm db:check

  build:
    name: Build every package once
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Only the packages something else's `test` task actually needs as a `^build` dependency —
      # never a leaf app or `@valence/screens`, since nothing depends on either of those and building
      # them here would be pure waste (and, for `apps/web` today, surfaces a real but unrelated
      # strictness gap between its own build and its typecheck script, worth its own fix).
      - run: >-
          pnpm turbo run build
          --filter=@valence/core
          --filter=@valence/contracts
          --filter=@valence/ui
          --filter=@valence/client
          --filter=@valence/plugin-sdk

      # Keyed on the commit rather than on source hashes, because this cache only has to outlive the
      # jobs in this one run — every test job below wants exactly what this build produced for this
      # commit, not the closest match for a similar one.
      - uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}

  test:
    name: Test (${{ matrix.package }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - '@valence/core'
          - '@valence/contracts'
          - '@valence/plugin-sdk'
          - '@valence/tools'
          - '@valence/ui'
          - '@valence/client'
          - '@valence/screens'
          - '@valence/server'
          - '@valence/web'
          - '@valence/desktop'
          - '@valence/landing'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-build-${{ github.sha }}

      - run: pnpm turbo run test --filter=${{ matrix.package }}

  rust:
    name: Transcoder lint and tests
    runs-on: ubuntu-latest
    # Not on pull requests. A Debian container, a cold Rust build and a decode against the shipped
    # FFmpeg is minutes of waiting, and paying it on every push to every branch buys less than it
    # costs: the pre-push hook has already run cargo clippy and cargo test on the machine the change
    # was written on.
    #
    # So it runs where being slow is affordable and being wrong is expensive: on the merge to main,
    # in the gate a release must pass, and once a week against the corpus in media-pipeline.yml. The
    # trade is that a transcoder break is caught just after a merge rather than just before one.
    if: github.event_name != 'pull_request'
    # In Debian, against the FFmpeg Valence ships, because these tests decode rather than merely
    # calling something that does. One of them scribbles over the middle of a clip and requires the
    # decoder to notice; Ubuntu's 6.1.1 decodes the damage without complaint and the test fails,
    # which says nothing about Valence and everything about which FFmpeg was asked. Testing the
    # transcoder against a build that ships to nobody answers a question nobody has.
    #
    # The shipped build is packaged for Debian and wants libraries Ubuntu noble does not carry, so
    # the container is what makes running the real thing possible at all.
    container:
      image: debian:bookworm-slim
    env:
      VALENCE_FFMPEG_VERSION: 8.1.2-5.1
      VALENCE_FFMPEG_SUITE: bookworm
      VALENCE_FFMPEG: /usr/lib/valence-ffmpeg/ffmpeg
      VALENCE_FFPROBE: /usr/lib/valence-ffmpeg/ffprobe
    steps:
      # Nothing is in a slim image, including what checkout needs to clone with. The corpus tools
      # are deliberately absent: cargo test shells out to FFmpeg and nothing else.
      - name: Everything the image does not carry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential pkg-config

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Before FFmpeg is fetched, so a formatting slip is not made to wait on a download.
      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - name: Install the FFmpeg Valence ships
        run: |
          curl -fsSL -o /tmp/valence-ffmpeg.deb \
            "https://github.com/ValenceOSS/valence-ffmpeg/releases/download/v${VALENCE_FFMPEG_VERSION}/valence-ffmpeg_${VALENCE_FFMPEG_VERSION}-${VALENCE_FFMPEG_SUITE}_amd64.deb"
          apt-get install -y --no-install-recommends /tmp/valence-ffmpeg.deb
          "$VALENCE_FFMPEG" -version | head -1
          # On the path as well as in the variables. The package installs beside the system's own
          # FFmpeg rather than as it, and a slim image has none, so a test reaching for the bare
          # name finds nothing.
          ln -sf "$VALENCE_FFMPEG" /usr/local/bin/ffmpeg
          ln -sf "$VALENCE_FFPROBE" /usr/local/bin/ffprobe

      # The corpus is deliberately not generated here. The suites that need one look for it and skip
      # when it is absent, and building it is the three minutes that belongs in media-pipeline.yml.
      - run: cargo test
