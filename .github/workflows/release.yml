name: Release

# Cuts a release from a tag: the image, the things worth downloading, and notes written from the
# commits themselves.
#
# Notes come from Conventional Commits rather than being written by hand, because the commit
# messages are already the record and a hand-written list is a second one that disagrees. The
# grouping in .github/release.yml decides what lands under which heading.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, which must already exist
        required: true
  # Called by release-please.yml once it has cut the tag. A tag pushed with the default
  # GITHUB_TOKEN starts no workflow of its own, so the release that made it calls this directly.
  workflow_call:
    inputs:
      tag:
        description: The tag to release, which must already exist
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  verify:
    name: Verify the TypeScript packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm db:check

      # Two packages at a time. Turbo sizes itself to the machine and every package's own runner sizes
      # itself the same way, so every suite at once on one GitHub runner is thrashing rather than
      # parallelism, and a test that takes one second alone takes past its timeout in the crowd. That
      # is why the pull request gate gives each package a runner, which a release does not need to.
      - run: pnpm turbo run test --concurrency=2

  # A job of its own, because it needs a different operating system. The transcoder's tests decode
  # against the FFmpeg Valence ships, which is packaged for Debian and wants libraries the runner's
  # Ubuntu does not carry — and a decode is exactly what they are for, so running them against some
  # other FFmpeg proves nothing about what is being released.
  #
  # This is also where the pull request gate's speed is paid back. Those tests do not run on every
  # branch, so a release is the moment they must.
  verify-rust:
    name: Verify the transcoder
    runs-on: ubuntu-24.04
    # Read only, and the checkout's token not left behind, in this job and in the native transcoder
    # builds: cargo runs every crate's build script, and none of them has any business holding the
    # write access the publishing jobs need.
    permissions:
      contents: read
    container:
      image: debian:bookworm-slim
    env:
      VALENCE_FFMPEG_VERSION: 8.1.2-5.4
      VALENCE_FFMPEG_SUITE: bookworm
      VALENCE_FFMPEG: /usr/lib/valence-ffmpeg/ffmpeg
      VALENCE_FFPROBE: /usr/lib/valence-ffmpeg/ffprobe
    steps:
      - name: Everything the image does not carry
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential pkg-config

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      # By commit rather than by the branch name, here and below: this workflow holds a token that
      # can write releases and packages, and a branch can be moved under it. Pinned that way, the
      # action has to be told which toolchain it was named for.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets -- -D warnings

      - name: Install the FFmpeg Valence ships
        run: |
          curl -fsSL -o /tmp/valence-ffmpeg.deb \
            "https://github.com/ValenceOSS/valence-ffmpeg/releases/download/v${VALENCE_FFMPEG_VERSION}/valence-ffmpeg_${VALENCE_FFMPEG_VERSION}-${VALENCE_FFMPEG_SUITE}_amd64.deb"
          apt-get install -y --no-install-recommends /tmp/valence-ffmpeg.deb
          "$VALENCE_FFMPEG" -version | head -1
          # On the path as well as in the variables: a slim image carries no system FFmpeg, so a
          # test reaching for the bare name finds nothing.
          ln -sf "$VALENCE_FFMPEG" /usr/local/bin/ffmpeg
          ln -sf "$VALENCE_FFPROBE" /usr/local/bin/ffprobe

      - run: cargo test

  image:
    name: Image (${{ matrix.image.name }})
    needs: [verify, verify-rust]
    runs-on: ubuntu-24.04
    # Two images from one repository: Valence itself, and the optional requests service beside it.
    # Each is built on its own runner with its own cache, since they share nothing but contracts.
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: valence
            file: docker/server.Dockerfile
            title: Valence
            description: A self-hosted streaming platform
          - name: valence-requests
            file: apps/requests/Dockerfile
            title: Valence requests
            description: The optional service that finds and downloads what Valence is asked for
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      # A registry accepts a lower case name and this owner is not spelt that way, so it is folded
      # here rather than written out and left to drift.
      - name: Work out what to call the image
        id: named
        run: echo "image=ghcr.io/${OWNER,,}/${NAME}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image.name }}

      # The tag names the release as "v0.3.0"; the running app should say "0.3.0", the way its own
      # CHANGELOG and package version already do.
      - name: Work out the version
        id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}

      # An image carries no .git, so the server is told which commit it was built from rather than
      # left to find out and fail.
      - name: Work out the commit
        id: commit
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Work out how to tag it
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.named.outputs.image }}
          # The version is handed over rather than read off the ref. release-please calls this
          # workflow rather than pushing a tag that starts it, so the ref here is main and there is
          # no semver in it to find. Left to infer, every type=semver produced nothing and the image
          # went out as latest alone, which is no use to anybody pinning a version.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.description=${{ matrix.image.description }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 alone. The other half of a multi-architecture build runs under emulation, and a
      # release-mode Rust build under QEMU takes long enough to be worth deciding on rather than
      # inheriting.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VALENCE_VERSION=${{ steps.version.outputs.version }}
            VALENCE_COMMIT=${{ steps.commit.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          provenance: false

  artefacts:
    name: Package the release files
    needs: [verify, verify-rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # What a deployment actually needs to stand this version up: the compose file that names the
      # image, and the environment it reads. The OpenAPI document is deliberately not here — it is
      # served by the running server at /api/openapi.json, and a copy cut at release time is a second
      # one that can disagree with the server somebody is pointing their client at.
      - name: Pack what a deployment needs
        run: |
          mkdir -p release
          cp compose.yaml release/compose.yaml
          cp docker/compose.native-transcoder.yaml release/compose.native-transcoder.yaml
          cp docker/compose.mysql.yaml release/compose.mysql.yaml
          cp docker/compose.mariadb.yaml release/compose.mariadb.yaml
          cp .env.example release/env.example
          tar -czf release/valence-web.tar.gz -C apps/web dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artefacts
          path: release/
          if-no-files-found: warn

  # The transcoder for a Mac, which runs natively there because a container on a Mac cannot reach
  # VideoToolbox (VAL-338). Everything else a Mac runs is the image above. One folder per
  # architecture, holding the transcoder and the FFmpeg it was verified against, which it finds
  # beside itself.
  #
  # Both architectures on one Apple silicon runner: Intel is a cross-compile, and macOS runners cost
  # ten times a Linux one. The FFmpeg is valence-ffmpeg's portable build, statically linked, so the
  # folder needs nothing else installed.
  transcoder-mac:
    name: Transcoder for macOS
    needs: [verify, verify-rust, image, artefacts]
    runs-on: macos-26
    permissions:
      contents: read
    env:
      VALENCE_FFMPEG_VERSION: 8.1.2-5.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Build both architectures
        run: |
          cargo build --release -p valence-transcoder --target aarch64-apple-darwin
          cargo build --release -p valence-transcoder --target x86_64-apple-darwin

      - name: Pack each with its FFmpeg
        run: |
          mkdir -p release
          for pair in arm64:aarch64-apple-darwin:macarm64 x64:x86_64-apple-darwin:mac64; do
            IFS=: read -r arch target build <<< "$pair"
            folder="pack-$arch/valence-transcoder"
            mkdir -p "$folder"
            cp "target/$target/release/valence-transcoder" "$folder/"
            curl -fsSL \
              "https://github.com/ValenceOSS/valence-ffmpeg/releases/download/v${VALENCE_FFMPEG_VERSION}/valence-ffmpeg_${VALENCE_FFMPEG_VERSION}_portable_${build}-gpl.tar.xz" \
              | tar -xJ -C "$folder"
            tar -czf "release/valence-transcoder-macos-$arch.tar.gz" -C "pack-$arch" valence-transcoder
          done
          "pack-arm64/valence-transcoder/valence-transcoder"
          "pack-arm64/valence-transcoder/ffmpeg" -version | head -1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valence-transcoder-mac
          path: release/
          if-no-files-found: error

  # The transcoder for Windows, which runs natively there for the same reason as on a Mac: inside
  # Docker Desktop only NVIDIA's encoder is reachable, and natively QSV, AMF and NVENC all are
  # (VAL-338). One folder holding the transcoder and valence-ffmpeg's portable build, which it
  # finds beside itself as ffmpeg.exe and ffprobe.exe, for x64 and for Windows on Arm.
  transcoder-windows:
    name: Transcoder for Windows (${{ matrix.arch }})
    needs: [verify, verify-rust, image, artefacts]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: windows-2025-vs2026
            ffmpeg: win64
          # Built natively on an ARM64 runner and packed with valence-ffmpeg's ARM64 build, so Windows
          # on Arm transcodes at full speed and reaches its Qualcomm GPU through Media Foundation,
          # neither of which the x64 build can do under emulation (VAL-355).
          - arch: arm64
            runner: windows-11-arm
            ffmpeg: winarm64
    env:
      VALENCE_FFMPEG_VERSION: 8.1.2-5.4
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - run: cargo build --release -p valence-transcoder

      # Run as well as packed: the transcoder starting, and FFmpeg reporting its version, is the proof
      # that both are this runner's architecture rather than something emulation happened to run.
      - name: Pack it with its FFmpeg
        env:
          ARCH: ${{ matrix.arch }}
          FFMPEG_TARGET: ${{ matrix.ffmpeg }}
        run: |
          folder=pack/valence-transcoder
          mkdir -p "$folder" release
          cp target/release/valence-transcoder.exe "$folder/"
          curl -fsSL -o ffmpeg.zip \
            "https://github.com/ValenceOSS/valence-ffmpeg/releases/download/v${VALENCE_FFMPEG_VERSION}/valence-ffmpeg_${VALENCE_FFMPEG_VERSION}_portable_${FFMPEG_TARGET}-clang-gpl.zip"
          unzip -j ffmpeg.zip ffmpeg.exe ffprobe.exe -d "$folder"
          "$folder/valence-transcoder.exe"
          "$folder/ffmpeg.exe" -version | head -1
          (cd pack && 7z a -tzip "../release/valence-transcoder-windows-${ARCH}.zip" valence-transcoder)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: valence-transcoder-windows-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  # The desktop app's installers, built by the workflow that owns that and attached below. A job that
  # calls a workflow rather than a step, so its artefacts are this run's like any other job's.
  #
  # Last, after every check and every other build has passed. Four runners, one of them a macOS one,
  # are the most expensive thing a release does and there is no point starting them for a release that
  # is already going to fail.
  desktop:
    name: Desktop app
    needs: [verify, verify-rust, image, artefacts]
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  publish:
    name: Publish the release
    needs: [image, artefacts, transcoder-mac, transcoder-windows, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artefacts
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: valence-desktop-*
          merge-multiple: true
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: valence-transcoder-mac
          path: release

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: valence-transcoder-windows-*
          merge-multiple: true
          path: release

      # The release already exists: release-please created it and tagged it. What it cannot write
      # is who did the work. Its notes come from commit messages, which carry no author and no pull
      # request number, so the body is replaced with the one GitHub generates from the merged pull
      # requests: every line reading "title by @somebody in #number".
      #
      # CHANGELOG.md keeps release-please's version, since a file in the repository should read as
      # a history rather than as a list of pull requests.
      - name: Notes that say who did the work
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish=main \
            -q .body > notes.md
          gh release edit "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}

      - name: Hang the artefacts on it
        run: gh release upload "$TAG" release/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}

  # Tells the community a release exists. The webhook belongs to the channel it is announced in, so
  # choosing the channel is choosing the webhook, and nothing in this file names one.
  #
  # The download links are read off the release itself rather than written here: whatever the
  # release carries under a desktop or mobile extension is listed, and a heading with nothing under
  # it is left out, so the announcement never promises a build that was not made.
  announce:
    name: Announce on Discord
    needs: [image, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Announce the release
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DISCORD_RELEASE_WEBHOOK is not set; nothing to announce."
            exit 0
          fi

          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          changelog_url="https://github.com/$GITHUB_REPOSITORY/blob/$TAG/CHANGELOG.md"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${GITHUB_REPOSITORY#*/}"
          version="${TAG#v}"

          assets="$(gh release view "$TAG" --json assets)"

          links() {
            echo "$assets" | jq -r --arg pattern "$1" '
              .assets[] | select(.name | test($pattern; "i")) | "[\(.name)](\(.url))"
            ' | paste -sd '\n' -
          }

          desktop="$(links '\.(dmg|exe|msi|AppImage|deb|rpm)$')"
          mobile="$(links '\.(apk|aab|ipa)$')"
          transcoder="$(links '^valence-transcoder-(macos|windows)-')"
          docker="\`docker pull $image:$version\`"

          jq -n \
            --arg tag "$TAG" \
            --arg release_url "$release_url" \
            --arg changelog_url "$changelog_url" \
            --arg desktop "$desktop" \
            --arg mobile "$mobile" \
            --arg transcoder "$transcoder" \
            --arg docker "$docker" '
            {
              username: "Valence",
              embeds: [{
                title: "Valence \($tag) is out",
                url: $release_url,
                color: 5793266,
                description: "Read what changed in the [release notes](\($release_url)) or the [changelog](\($changelog_url)).",
                fields: ([
                  (if $desktop == "" then empty else {name: "Desktop", value: $desktop} end),
                  (if $mobile == "" then empty else {name: "Mobile", value: $mobile} end),
                  (if $transcoder == "" then empty else {name: "Native transcoder", value: $transcoder} end),
                  {name: "Docker", value: $docker}
                ])
              }]
            }' > payload.json

          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$WEBHOOK"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
