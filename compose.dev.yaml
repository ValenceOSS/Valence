services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: valence
      POSTGRES_PASSWORD: valence
      POSTGRES_DB: valence
    volumes:
      # /var/lib/postgresql rather than /var/lib/postgresql/data: from 18 the
      # image keeps its data in a directory named for the major version, so a
      # mount at the old path is left unused and the container refuses to start
      # rather than quietly writing somewhere that is not kept.
      - db-data:/var/lib/postgresql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U valence']
      interval: 10s
      timeout: 5s
      retries: 5

  valence:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://valence:valence@db:5432/valence
      PORT: '8420'
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8420}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:8420}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      AUTH_RATE_LIMIT_ENABLED: ${AUTH_RATE_LIMIT_ENABLED:-true}
      # Where rendered previews and thumbnail sheets are kept. Not the same
      # question as where segments are written, and deliberately separate: a
      # segment is written while somebody is watching and thrown away behind
      # them, so it wants the fastest disk in the machine, while a sheet costs
      # minutes of decoding a film and is read for as long as that film is in
      # the library, so it wants a disk that is kept. Point this at
      # network-attached storage if that is where the space is, and leave the
      # transcode directory on something local.
      #
      # Whatever you set it to, map a volume there. Anything written to a path
      # with no volume behind it lives on the container's own filesystem and is
      # gone the next time the container is recreated — which is what an update
      # does. Valence says so at startup and on the admin page rather than
      # letting a library quietly re-render itself every week.
      VALENCE_ARTEFACT_DIR: ${VALENCE_ARTEFACT_DIR:-/cache/artefacts}

      # Where the household's profile pictures are kept. Under /config rather than /cache on
      # purpose: a preview can always be rendered again, and a picture somebody uploaded cannot.
      PROFILE_IMAGE_DIR: ${PROFILE_IMAGE_DIR:-/config/profiles}

      # The clock scheduled jobs keep. A container has no other way to know where it is, and
      # defaults to UTC — so without this, "daily at 03:00" is 03:00 UTC rather than 3am here.
      TZ: ${TZ:-UTC}
      REQUESTS_URL: ${REQUESTS_URL:-}
      REQUESTS_SECRET: ${REQUESTS_SECRET:-}
    ports:
      - '8420:8420'
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - config:/config
      - cache:/cache
      - transcodes:/transcodes
      - ${VALENCE_MEDIA_PATH:-./media}:/media:ro

  # Only with `docker compose -f compose.dev.yaml --profile requests up`, and
  # with REQUESTS_URL=http://requests:8421 and REQUESTS_SECRET set in .env.
  requests:
    build:
      context: .
      dockerfile: apps/requests/Dockerfile
    profiles: [requests]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://valence:valence@db:5432/valence
      REQUESTS_SECRET: ${REQUESTS_SECRET:-}
      VPN_URL: ${VPN_URL:-}
      VPN_API_KEY: ${VPN_API_KEY:-}
      FLARESOLVERR_URL: ${FLARESOLVERR_URL:-}
      DEFINITIONS_REPOSITORY: ${DEFINITIONS_REPOSITORY:-Prowlarr/Indexers}
      DEFINITIONS_BRANCH: ${DEFINITIONS_BRANCH:-master}
      DEFINITIONS_PATH: ${DEFINITIONS_PATH:-definitions/v11}
      TZ: ${TZ:-UTC}
    ports:
      - '8421:8421'
    volumes:
      - ${VALENCE_MEDIA_PATH:-./media}:/media
      - ${VALENCE_DOWNLOADS_PATH:-./downloads}:/downloads

  # Only with `--profile flaresolverr`, and FLARESOLVERR_URL=http://flaresolverr:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: [flaresolverr]
    restart: unless-stopped
    ports:
      - '8191:8191'

volumes:
  db-data:
  config:
  cache:
  transcodes:
