plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.valence'
version = '1.0.0'

android {
  namespace "app.valence.modules.music"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.media3:media3-exoplayer:1.9.0'
  implementation 'androidx.media3:media3-session:1.9.0'
}
