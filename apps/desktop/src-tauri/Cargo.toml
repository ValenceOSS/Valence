[package]
name = "valence-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Valence, a self-hosted streaming platform, as a desktop app."

[lints]
workspace = true

[lib]
name = "valence_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-single-instance = "2.5"
tauri-plugin-notification = "2.8"
tauri-plugin-opener = "2.7"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "cookies", "json"] }
reqwest_cookie_store = "0.8"
cookie_store = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time", "net", "sync"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6"
rand = "0.9"
mdns-sd = "0.13"
hostname = "0.4"
base64 = "0.22"
if-addrs = "0.13"
keepawake = "0.6"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rusty-leveldb = "4"
aes = "0.8"
cbc = "0.1"
aes-gcm = "0.10"
sha1 = "0.10"
sha2 = "0.10"
time = "0.3"
keyring = "4.2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
tempfile = "3"
cookie = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Networking_WindowsWebServices", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow", "NSButton", "NSControl", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
secret-service = "5"
webkit2gtk = "2.0.2"
zbus = "5"

[dev-dependencies]
http-body-util = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros", "rt"] }
