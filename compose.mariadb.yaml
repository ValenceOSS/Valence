# Valence on MariaDB rather than Postgres. Laid over compose.yaml rather than instead of it:
#
#   docker compose -f compose.yaml -f compose.mariadb.yaml up -d
#
# The password is still POSTGRES_PASSWORD, kept from when Postgres was the only choice so that one
# setting serves whichever database is chosen. The data lives in a volume of its own, since a
# Postgres data directory is no use to MariaDB and the other way round. Choose before the first start:
# Valence moves no data from one kind of database to another.

services:
  db:
    image: mariadb:11.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_nopad_bin
    environment: !override
      MARIADB_ROOT_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MARIADB_USER: valence
      MARIADB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      MARIADB_DATABASE: valence
      TZ: ${TZ:-UTC}
    volumes: !override
      - db-data-mariadb:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']

  valence:
    environment:
      DATABASE_URL: mariadb://valence:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:3306/valence

  requests:
    environment:
      DATABASE_URL: mariadb://valence:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:3306/valence

volumes:
  db-data-mariadb:
